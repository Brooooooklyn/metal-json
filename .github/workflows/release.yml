name: Release

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  # Release unpublished versions to crates.io via Trusted Publishing (OIDC).
  # Runs on macOS because the default build embeds an AOT-built metallib, so
  # `cargo publish`'s verification build needs the Xcode Metal toolchain
  # (`xcrun -sdk macosx metal`) — see build.rs.
  release-plz-release:
    name: Release-plz release
    runs-on: macos-26
    if: ${{ github.repository_owner == 'Brooooooklyn' }}
    permissions:
      contents: write
      id-token: write # OIDC token exchange with crates.io (Trusted Publishing)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CARGO_REGISTRY_TOKEN: release-plz performs the crates.io OIDC
          # token exchange itself when id-token: write is granted.

  # Open/update a PR that bumps versions and writes CHANGELOG.md from the
  # conventional commits since the last release. No build, so Linux is fine.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Brooooooklyn' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
